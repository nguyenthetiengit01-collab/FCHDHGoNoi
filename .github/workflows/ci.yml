name: CI Quality Gates

on:
  pull_request:
    branches:
      - main
      - fix/phase-7.1-pre-release-remediation
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    name: Quality Gates (Node 22.23.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js v22.23.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: "Gate 1: Install dependencies (npm ci)"
        run: |
          echo "::group::Gate 1 - npm ci"
          node -v
          npm ci
          echo "::endgroup::"

      - name: "Gate 2: Test Suite (npm test -- --maxWorkers=1)"
        run: |
          echo "::group::Gate 2 - npm test -- --maxWorkers=1"
          npm test -- --maxWorkers=1
          echo "::endgroup::"

      - name: "Gate 3: ESLint (npm run lint)"
        run: |
          echo "::group::Gate 3 - npm run lint"
          npm run lint
          echo "::endgroup::"

      - name: "Gate 4: TypeScript Typecheck (npx tsc --noEmit)"
        run: |
          echo "::group::Gate 4 - npx tsc --noEmit"
          npx tsc --noEmit
          echo "::endgroup::"

      - name: "Gate 5: Next.js Build with isolated TEMP/TMP (npm run build)"
        run: |
          echo "::group::Gate 5 - npm run build"
          mkdir -p "${{ runner.temp }}/nextjs-build"
          TEMP="${{ runner.temp }}/nextjs-build" \
          TMP="${{ runner.temp }}/nextjs-build" \
          TMPDIR="${{ runner.temp }}/nextjs-build" \
          npm run build
          echo "::endgroup::"

  e2e-visual-qa:
    name: >-
      Playwright Visual & Accessibility QA (${{ matrix.os == 'ubuntu-latest' && 'Linux' || 'Windows' }})
    needs: quality-gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js v22.23.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Run Playwright Visual & WCAG 2.2 AA QA (npm run test:e2e)
        env:
          CI: "true"
          QA_ROOT: ${{ runner.temp }}/gonoifc-qa-${{ github.run_id }}-${{ github.run_attempt }}
          MEDIA_STORAGE_ENABLED: "false"
          ANALYTICS_ENABLED: "false"
        run: npm run test:e2e

      - name: Upload Playwright QA artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-qa-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/gonoifc-qa-${{ github.run_id }}-${{ github.run_attempt }}/screenshots
            ${{ runner.temp }}/gonoifc-qa-${{ github.run_id }}-${{ github.run_attempt }}/test-results
            ${{ runner.temp }}/gonoifc-qa-${{ github.run_id }}-${{ github.run_attempt }}/html-report
          if-no-files-found: warn
