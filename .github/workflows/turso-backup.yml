name: Weekly Turso Production Backup (Read-Only)

on:
  schedule:
    # 03:00 sáng Thứ Hai (UTC+7) hàng tuần
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turso-production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Turso Production (v3 Read-Only Encrypted)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js v22.23.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Production read-only and encryption public-key secrets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_PROD_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_PROD_AUTH_TOKEN_RO }}
          BACKUP_ENCRYPTION_PUBLIC_KEY: ${{ secrets.TURSO_BACKUP_PUBLIC_KEY }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ] || [ -z "$BACKUP_ENCRYPTION_PUBLIC_KEY" ]; then
            echo "::error::Missing required secrets: TURSO_PROD_DATABASE_URL, TURSO_PROD_AUTH_TOKEN_RO, or TURSO_BACKUP_PUBLIC_KEY."
            exit 1
          fi

      - name: Run read-only Turso Production Backup (v3)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_PROD_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_PROD_AUTH_TOKEN_RO }}
        run: |
          node scripts/db-backup.mjs --out /tmp/gonoi-prod-backup.json >/tmp/backup-summary.json
          node -e '
            const fs = require("node:fs");
            const s = JSON.parse(fs.readFileSync("/tmp/backup-summary.json", "utf8"));
            console.log(JSON.stringify({ status: s.status, version: s.version, objectCounts: s.objectCounts, rowCounts: s.rowCounts }, null, 2));
          '

      - name: Validate backup v3 structure, sequences, and local restore integrity
        run: |
          if [ ! -s /tmp/gonoi-prod-backup.json ]; then
            echo "::error::Backup file is missing or empty."
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            import { validateBackupPayload } from "./scripts/lib/backup-format.mjs";
            const backup = JSON.parse(fs.readFileSync("/tmp/gonoi-prod-backup.json", "utf8"));
            const { version } = validateBackupPayload(backup);
            if (version !== 3) {
              throw new Error(`Expected backup version 3, got ${version}`);
            }
            if (!backup.schema || Object.keys(backup.schema).length === 0) {
              throw new Error("Backup schema is empty.");
            }
            if (!Array.isArray(backup.objects?.tables) || backup.objects.tables.length === 0) {
              throw new Error("Backup objects.tables is empty.");
            }
            if (!Array.isArray(backup.sequences)) {
              throw new Error("Backup sequences metadata is missing.");
            }
            console.log("Backup v3 validation OK:", {
              version,
              tables: backup.objects.tables.length,
              indexes: backup.objects.indexes.length,
              triggers: backup.objects.triggers.length,
              views: backup.objects.views.length,
              sequences: backup.sequences.length,
            });
          '
          node scripts/db-restore.mjs --in /tmp/gonoi-prod-backup.json --target /tmp/verify-restore.sqlite --confirm >/dev/null
          echo "Local SQLite restore integrity check OK."

      - name: Encrypt backup artifact with public key and purge plaintext
        env:
          BACKUP_ENCRYPTION_PUBLIC_KEY: ${{ secrets.TURSO_BACKUP_PUBLIC_KEY }}
        run: |
          node scripts/backup-crypto.mjs encrypt --in /tmp/gonoi-prod-backup.json --out /tmp/gonoi-prod-backup.json.enc
          rm -f /tmp/gonoi-prod-backup.json /tmp/verify-restore.sqlite
          if [ ! -s /tmp/gonoi-prod-backup.json.enc ]; then
            echo "::error::Encrypted backup artifact is missing or empty."
            exit 1
          fi

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: turso-prod-backup-${{ github.run_id }}.enc
          path: /tmp/gonoi-prod-backup.json.enc
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup temporary backup files
        if: always()
        run: rm -f /tmp/gonoi-prod-backup.json /tmp/gonoi-prod-backup.json.enc /tmp/backup-summary.json /tmp/verify-restore.sqlite

      - name: Report backup failure alert
        if: failure()
        run: |
          echo "::error::Weekly Turso Production Backup failed for run ${{ github.run_id }} (ref: ${{ github.ref }}). Check workflow step logs for details."
          {
            echo "### Turso Production Backup Failed"
            echo ""
            echo "- **Workflow:** ${{ github.workflow }}"
            echo "- **Run ID:** ${{ github.run_id }}"
            echo "- **Ref:** \`${{ github.ref }}\`"
            echo "- **Action Required:** Inspect the failed step in GitHub Actions logs and verify Turso read-only connectivity and backup encryption configuration."
          } >> "$GITHUB_STEP_SUMMARY"
